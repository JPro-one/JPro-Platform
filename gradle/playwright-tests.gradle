// Splits a module's tests: `test` runs the unit tests, `playwrightTest` the JProPlaywrightTest subclasses
// (tagged "playwright"), which drive a JPro app in a browser. `check` runs both.

test {
    useJUnitPlatform {
        excludeTags 'playwright', 'keycloak'
    }
}

def playwrightTest = tasks.register('playwrightTest', Test) {
    group = 'verification'
    description = 'Runs the Playwright tests, which drive a JPro app in a browser'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'playwright'
        excludeTags 'keycloak'
    }
    jvmArgumentProviders.add({ tasks.test.jvmArgs } as CommandLineArgumentProvider)
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
        exceptionFormat "full"
    }
    dependsOn ':jpro-playwright:installPlaywright'
    // installPlaywright already provisioned the browser, so skip the download during the run.
    environment 'PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD', '1'
    // Forward the test overrides (port, browser, headless) to the test JVM.
    ['jpro.test.port', 'jpro.test.browser', 'jpro.test.headless'].each { key ->
        if (System.getProperty(key) != null) systemProperty key, System.getProperty(key)
    }
    // The app under test is started by a nested Gradle build, so Gradle can't see what the tests depend on.
    outputs.upToDateWhen { false }
    shouldRunAfter tasks.test
}

tasks.named('check') {
    dependsOn playwrightTest
}
