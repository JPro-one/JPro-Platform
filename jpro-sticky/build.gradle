dependencies {
  implementation "one.jpro:jpro-webapi:$JPRO_VERSION"
  implementation "one.jpro:jmemorybuddy:$JMEMORYBUDDY_VERSION"
  implementation "org.slf4j:slf4j-api:$SLF4J_API_VERSION"

  // End-to-end tests (StickyPlaywrightTest) drive the :jpro-sticky:example app through the
  // jpro-playwright helper library, which exposes Playwright and JUnit as api dependencies.
  testImplementation project(":jpro-playwright")
}

apply from: rootProject.file('gradle/playwright-tests.gradle')

tasks.named('playwrightTest') {
  dependsOn 'installPlaywrightFirefox'
}

// StickyFirefoxTest drives the engine issue #127 was reported against.
tasks.register('installPlaywrightFirefox', JavaExec) {
  group = 'verification'
  description = 'Install the Firefox browser used by StickyFirefoxTest'
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'com.microsoft.playwright.CLI'
  args = ['install', '--with-deps', 'firefox']
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      // Add README.md as an artifact named DOCUMENTATION.md
      artifact(source: file('build/docs/DOCUMENTATION.md')) {
        classifier 'DOCUMENTATION'
        extension 'md'
      }

      pom {
        name = 'JPro Sticky'
        description = 'Scroll-aware positioning (sticky and fixed) for JavaFX nodes on the web'
      }
    }
  }
}

tasks.register('renameReadme', Copy) {
  from 'README.md'
  into layout.buildDirectory.dir('docs')
  rename 'README.md', 'DOCUMENTATION.md'
}

javadocJar.dependsOn renameReadme
