dependencies {
  implementation "one.jpro:jpro-webapi:$JPRO_VERSION"
  implementation "one.jpro:jmemorybuddy:$JMEMORYBUDDY_VERSION"
  implementation "org.slf4j:slf4j-api:$SLF4J_API_VERSION"

  // End-to-end tests (StickyPlaywrightTest) drive the :jpro-sticky:example app through the
  // jpro-playwright helper library, which exposes Playwright and JUnit as api dependencies.
  testImplementation project(":jpro-playwright")
}

test {
  // The Playwright tests need a Chromium (installPlaywright provides it) and the example's port.
  dependsOn 'installPlaywright', 'installPlaywrightFirefox'
  // Forward the test overrides (port, browser, headless) to the test JVM.
  ['jpro.test.port', 'jpro.test.browser', 'jpro.test.headless'].each { key ->
    if (System.getProperty(key) != null) systemProperty key, System.getProperty(key)
  }
  // The app under test is started by a nested Gradle build, so Gradle can't see what the tests depend on.
  outputs.upToDateWhen { false }
  // installPlaywright already provisioned the browser, so skip the download during the run.
  environment 'PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD', '1'
}

// Installs the browser the Playwright tests drive (with system deps, as CI needs them).
tasks.register('installPlaywright', JavaExec) {
  group = 'verification'
  description = 'Install the browser used by the Playwright tests (-Djpro.test.browser, default chromium)'
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'com.microsoft.playwright.CLI'
  args = ['install', '--with-deps', System.getProperty('jpro.test.browser') ?: 'chromium']
}

// StickyFirefoxTest drives the engine issue #127 was reported against.
tasks.register('installPlaywrightFirefox', JavaExec) {
  group = 'verification'
  description = 'Install the Firefox browser used by StickyFirefoxTest'
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'com.microsoft.playwright.CLI'
  args = ['install', '--with-deps', 'firefox']
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      // Add README.md as an artifact named DOCUMENTATION.md
      artifact(source: file('build/docs/DOCUMENTATION.md')) {
        classifier 'DOCUMENTATION'
        extension 'md'
      }

      pom {
        name = 'JPro Sticky'
        description = 'Scroll-aware positioning (sticky and fixed) for JavaFX nodes on the web'
      }
    }
  }
}

tasks.register('renameReadme', Copy) {
  from 'README.md'
  into layout.buildDirectory.dir('docs')
  rename 'README.md', 'DOCUMENTATION.md'
}

javadocJar.dependsOn renameReadme
